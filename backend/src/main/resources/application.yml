server:
  port: 8888
  servlet:
    context-path: /api

spring:
  application:
    name: h5-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/h5_game?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.h5.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: h5-game-secret-key-2024-please-change-in-production-0123456789
  expiration: 86400000  # 24小时
  header: Authorization
  prefix: "Bearer "

# 站点配置
site:
  name: H5 Game
  domain: https://h5.lexiangim.com

logging:
  level:
    com.h5: debug
    org.springframework.web: info
