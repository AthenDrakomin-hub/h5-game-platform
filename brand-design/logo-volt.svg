<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="volt-electric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6FF00"/>
      <stop offset="100%" stop-color="#76FF03"/>
    </linearGradient>
    <linearGradient id="volt-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
  </defs>
  <!-- 图标：闪电 V -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#volt-dark)"/>
    <!-- 闪电形状 -->
    <path d="M58 12 L32 54 L48 54 L40 88 L70 42 L54 42 L62 12 Z" fill="url(#volt-electric)"/>
    <!-- 电光效果线 -->
    <line x1="15" y1="85" x2="28" y2="85" stroke="#C6FF00" stroke-width="1.5" opacity="0.4"/>
    <line x1="72" y1="15" x2="85" y2="15" stroke="#76FF03" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- 品牌名 -->
  <text x="130" y="58" font-family="'Arial Black',Arial,sans-serif" font-size="44" font-weight="900" fill="url(#volt-electric)" letter-spacing="3">VOLT</text>
  <text x="130" y="85" font-family="Arial,sans-serif" font-size="14" fill="#888888" letter-spacing="8">闪电娱乐</text>
</svg>