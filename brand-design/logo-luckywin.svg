<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="lw-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D98A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8C2C"/>
    </linearGradient>
    <linearGradient id="lw-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1B4E"/>
      <stop offset="100%" stop-color="#1A0F2E"/>
    </linearGradient>
  </defs>
  <!-- 图标：盾牌 + 皇冠 -->
  <g transform="translate(10, 10)">
    <path d="M50 5 L90 20 L90 55 Q90 85 50 100 Q10 85 10 55 L10 20 Z" fill="url(#lw-purple)" stroke="url(#lw-gold)" stroke-width="2.5"/>
    <!-- 皇冠 -->
    <path d="M25 30 L35 15 L50 25 L65 15 L75 30 L70 42 L30 42 Z" fill="url(#lw-gold)"/>
    <circle cx="35" cy="15" r="3" fill="#F5D98A"/>
    <circle cx="65" cy="15" r="3" fill="#F5D98A"/>
    <circle cx="50" cy="10" r="3.5" fill="#F5D98A"/>
    <!-- LW 字母 -->
    <text x="50" y="75" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="url(#lw-gold)" text-anchor="middle">LW</text>
  </g>
  <!-- 品牌名 -->
  <text x="125" y="58" font-family="Georgia,serif" font-size="36" font-weight="bold" fill="url(#lw-gold)" letter-spacing="3">乐盈</text>
  <text x="125" y="88" font-family="Arial,sans-serif" font-size="16" fill="#C9A96E" letter-spacing="6">LUCKY WIN</text>
</svg>