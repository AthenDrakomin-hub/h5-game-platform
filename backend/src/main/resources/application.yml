server:
  port: 8888
  servlet:
    context-path: /api

# API文档 (生产环境可通过 springdoc.api-docs.enabled=false 关闭)
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

spring:
  application:
    name: h5-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/h5_game?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # Redis 配置（分布式限流/Bot会话，未配置时自动降级内存）
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.h5.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: h5-game-secret-key-2024-please-change-in-production-0123456789
  expiration: 86400000  # 24小时
  header: Authorization
  prefix: "Bearer "

# 站点配置
site:
  name: NOVA 新星娱乐
  domain: https://h5.goodspage.cn

# 开奖调度配置
draw:
  scheduling:
    enabled: true  # 是否启用自动开奖调度
  provider:
    marksix6:
      enabled: true  # 启用第三方开奖API（MarkSix6）
      api-url: https://api3.marksix6.net/lottery_api.php
      timeout: 5000

# 管理员初始化配置
admin:
  init:
    username: admin
    password: yefeng

# Telegram Bot Token（用于 Mini App initData 签名验证）
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}

# USDT 自动到账配置
usdt:
  trc20:
    enabled: true  # 启用TRC20自动到账监听
    grid-api: https://api.trongrid.io  # TronGrid API 地址
    api-key: ""  # TronGrid API Key（可选，提高限流）
    poll-interval: 5000  # 轮询间隔(毫秒)
    confirmations: 1  # 确认数（TRC20一般1个确认即可）
    min-confirmations: 1

logging:
  level:
    com.h5: debug
    org.springframework.web: info
