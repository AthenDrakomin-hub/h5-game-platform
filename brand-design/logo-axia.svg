<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="axia-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="axia-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F0D24"/>
    </linearGradient>
  </defs>
  <!-- 图标：几何 X 轴 -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#axia-dark)"/>
    <!-- X 几何图形 -->
    <path d="M30 25 L45 50 L30 75 L40 82 L55 57 L70 82 L80 75 L65 50 L80 25 L70 18 L55 43 L40 18 Z" fill="url(#axia-neon)"/>
    <!-- 中心点 -->
    <circle cx="55" cy="50" r="5" fill="#fff"/>
  </g>
  <!-- 品牌名 -->
  <text x="130" y="58" font-family="'Arial Black',Arial,sans-serif" font-size="42" font-weight="900" fill="url(#axia-neon)" letter-spacing="4">AXIA</text>
  <text x="130" y="85" font-family="Arial,sans-serif" font-size="14" fill="#A855F7" letter-spacing="8">轴娱</text>
</svg>