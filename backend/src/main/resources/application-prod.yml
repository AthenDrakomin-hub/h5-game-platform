# ============================================================
# 生产环境配置
# 所有敏感信息通过环境变量注入，不在代码库中存储
# 启动命令: java -jar h5-backend.jar --spring.profiles.active=prod
# 环境变量文件: /opt/h5-game/.env (systemd EnvironmentFile)
# ============================================================

server:
  port: ${SERVER_PORT:8888}
  servlet:
    context-path: /api

spring:
  application:
    name: h5-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/h5_game?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:h5_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.h5.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl  # 生产环境关闭SQL日志
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（必须通过环境变量设置，不可使用默认值）
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}
  header: Authorization
  prefix: "Bearer "

# 站点配置
site:
  name: ${SITE_NAME:NOVA 新星娱乐}
  domain: ${SITE_DOMAIN:https://h5.goodspage.cn}

# 开奖调度配置
draw:
  scheduling:
    enabled: ${DRAW_ENABLED:true}
  provider:
    marksix6:
      enabled: ${DRAW_MARKSIX6_ENABLED:true}
      api-url: ${DRAW_MARKSIX6_URL:https://api3.marksix6.net/lottery_api.php}
      timeout: 5000

# 管理员初始化（ADMIN_PASSWORD 留空则首次启动随机生成并打印一次）
admin:
  init:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}

# USDT 自动到账
usdt:
  trc20:
    enabled: ${USDT_TRX_ENABLED:true}
    grid-api: ${USDT_GRID_API:https://api.trongrid.io}
    api-key: ${USDT_GRID_KEY:}
    poll-interval: ${USDT_POLL_INTERVAL:5000}
    confirmations: 1

logging:
  level:
    com.h5: ${LOG_LEVEL:info}
    org.springframework.web: warn
  file:
    name: ${LOG_FILE:/opt/h5-game/logs/backend.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 14
