server:
  port: 18888
  servlet:
    context-path: /api

spring:
  application:
    name: h5-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/h5_game?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: h5game
    password: H5g@me2024!
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.h5.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: H5GameProdSecret2024!SafeKeyForTokenSigning
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

site:
  name: H5 Game
  domain: https://goodspage.cn

logging:
  level:
    com.h5: info
    org.springframework.web: info
