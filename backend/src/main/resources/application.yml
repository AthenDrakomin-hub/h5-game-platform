server:
  port: 8888
  servlet:
    context-path: /api

# 生产环境关闭 Swagger（开发通过 SPRINGDOC_ENABLED=true 打开）
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

spring:
  application:
    name: h5-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/h5_game?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # Redis 配置（分布式限流/Bot会话，未配置时自动降级内存）
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.h5.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
# 生产必须通过 JWT_SECRET 环境变量注入强随机值；下方默认值仅用于本地开发，禁止用于生产
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-0123456789}
  expiration: 86400000  # 24小时
  header: Authorization
  prefix: "Bearer "

# 站点配置
site:
  name: NOVA 新星娱乐
  domain: https://h5.goodspage.cn

# 开奖调度配置
draw:
  scheduling:
    enabled: true  # 是否启用自动开奖调度
  provider:
    marksix6:
      enabled: true  # 启用第三方开奖API（MarkSix6）
      api-url: https://api3.marksix6.net/lottery_api.php
      timeout: 5000

# 管理员初始化配置
# ADMIN_PASSWORD 留空时，首次启动随机生成强密码并只打印一次到日志（见 AdminDataInitializer）
admin:
  init:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}

# 认证入口开关
# 生产默认 false：C 端只允许 Telegram initData 登录，关闭账号密码/注册/试玩
app:
  auth:
    allow-password-login: ${ALLOW_PASSWORD_LOGIN:false}
  cors:
    # 逗号分隔的允许来源；本地开发可设 http://localhost:5173
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://h5.goodspage.cn}

# 后端 → Bot 通知（本机调用，不对外）
bot:
  notify:
    url: ${BOT_NOTIFY_URL:http://127.0.0.1:3001/api/bot/notify/send}
    secret: ${BOT_INTERNAL_SECRET:}

# Telegram Bot Token（用于 Mini App initData 签名验证）
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}

# USDT 自动到账配置
usdt:
  trc20:
    enabled: true  # 启用TRC20自动到账监听
    grid-api: https://api.trongrid.io  # TronGrid API 地址
    api-key: ""  # TronGrid API Key（可选，提高限流）
    poll-interval: 5000  # 轮询间隔(毫秒)
    confirmations: 1  # 确认数（TRC20一般1个确认即可）
    min-confirmations: 1

logging:
  level:
    com.h5: debug
    org.springframework.web: info
