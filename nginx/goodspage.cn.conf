server {
    listen 80;
    server_name h5.goodspage.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name h5.goodspage.cn;

    # SSL证书
    ssl_certificate /etc/nginx/ssl/goodspage.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/goodspage.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 前端用户端
    root /opt/h5-game/web-root;
    index index.html;

    # 管理端
    location /admin/ {
        alias /opt/h5-game/web-root/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # API反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # WebSocket支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Telegram Bot Webhook（仅 Telegram 回调，secret 由 bot 校验）
    location = /bot/webhook {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # 安全头
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # 前端路由（Hash模式不需要try_files，但留着备用）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
